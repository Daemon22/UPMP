<html lang="en">

<style>
:root{color-scheme:dark;--ink:#061522;--panel:#0a2032;--line:rgba(137,188,220,.16);--text:#edf7ff;--muted:#8fa9bf;--gold:#edc36e;--green:#77e4a7;--red:#ff9991;--blue:#35c8fb;--violet:#b786ff;font-family:Inter,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 72% 0%,rgba(25,108,166,.2),transparent 38%),radial-gradient(ellipse at 38% 94%,rgba(38,110,94,.12),transparent 38%),linear-gradient(145deg,#061522,#081a2b 52%,#061522)}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:1680px;margin:auto;padding:22px clamp(16px,3vw,48px) 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:17px}.brand{display:flex;align-items:center;gap:12px}.emblem{width:48px;height:48px;border:1px solid #b58d48;border-radius:50%;overflow:hidden;box-shadow:0 0 22px #167fc055}.emblem img{width:100%;height:100%;object-fit:cover;object-position:50% 33%;transform:scale(1.2)}.wordmark{height:28px;max-width:112px;object-fit:contain}.brand small{display:block;color:var(--gold);font-size:8px;letter-spacing:2px;margin-top:5px}.connection{display:flex;align-items:center;gap:9px;border:1px solid rgba(119,228,167,.22);background:#42c78e12;padding:8px 12px;border-radius:24px;color:#a4edc5;font-size:10px;font-weight:800;letter-spacing:.7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.dot.bad{background:var(--red);box-shadow:0 0 10px var(--red)}.crumbs{display:flex;align-items:center;gap:8px;margin:22px 0 18px;color:#819ab0;font-size:11px;flex-wrap:wrap}.crumbs button{padding:0;background:none;color:inherit;border:0}.crumbs button:hover,.crumbs .here{color:#f4f9fd}.crumbs .sep{color:#4c667d}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px}.eyebrow{color:var(--gold);font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.hero h1{font:700 clamp(24px,3vw,35px)/1.12 Georgia,serif;margin:0}.goal{color:var(--muted);font-size:12px;margin:8px 0 0;max-width:760px;line-height:1.5}.outcome{border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:148px;text-align:right;background:#10273b88}.outcome span{display:block;color:#829bb0;text-transform:uppercase;font-size:8px;letter-spacing:1.4px}.outcome b{display:block;margin-top:5px;color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.outcome b.verified{color:var(--green)}.outcome b.failed{color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:15px}.metric{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:13px;background:linear-gradient(120deg,#132d42d9,#0c2133e3);padding:13px 15px;min-height:79px}.metric:after{content:"";position:absolute;right:-19px;top:-37px;width:68px;height:68px;border:1px solid #edc36e20;border-radius:50%;box-shadow:0 0 0 10px #2d9fcc08,0 0 0 20px #edc36e05}.ml{font-size:8px;color:#8ca6bb;letter-spacing:1.2px;text-transform:uppercase;font-weight:800}.mv{font-size:18px;font-weight:800;margin-top:8px}.mv small{font-size:9px;color:#7fa0b4;font-weight:500}.river{border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,#0c2336f7,#07192af5);box-shadow:0 18px 55px #0003;overflow:hidden}.river-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:14px}.river-title{font-size:12px;font-weight:800}.river-sub{font-size:9px;color:#829db2;margin-top:4px}.tools{display:flex;align-items:center;gap:8px}.zoom{display:flex;align-items:center;overflow:hidden;border:1px solid var(--line);border-radius:9px}.zoom button{width:31px;height:29px;border:0;background:#ffffff07;font-size:16px}.zoom button:hover{background:#ffffff15}.zoom span{padding:0 8px;border-inline:1px solid var(--line);height:29px;display:grid;place-items:center;color:#8fa9bf;font-size:9px}.refresh{border:1px solid var(--line);border-radius:9px;background:#ffffff08;padding:8px 10px;color:#b9cbd8;font-size:9px}.map{position:relative;min-height:380px;margin:0 9px;overflow:hidden;border-radius:12px;background:radial-gradient(ellipse at 52% 53%,#2b6b961c,transparent 56%),repeating-radial-gradient(ellipse at 23% 50%,transparent 0 39px,#65a4c20e 40px 41px,transparent 42px 66px)}.map-inner{position:absolute;inset:0;transform:scale(var(--zoom,1));transform-origin:50% 50%;transition:transform .3s}.streams-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}.streams-svg path{fill:none;stroke-linecap:round;stroke-linejoin:round}.stream-shadow{stroke:#030c16dd;stroke-width:22}.stream-glow{stroke:#2ba3db26;stroke-width:18;filter:blur(5px)}.stream-main{stroke:url(#river);stroke-width:4;filter:url(#glow)}.stream-core{stroke:#dcfbffb3;stroke-width:1;stroke-dasharray:9 15;animation:flow 8s linear infinite}.stream-branch{stroke:url(#tributary);stroke-width:3.3;filter:url(#glow);opacity:.84}.node{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);width:clamp(150px,17vw,207px);min-height:118px;text-align:left;padding:12px;border-radius:14px;border:1px solid #87b7d23d;background:linear-gradient(145deg,#102a3df7,#081b2bf7);box-shadow:0 12px 27px #0005,inset 0 1px #ffffff0b;transition:.2s;z-index:2}.node:hover{transform:translate(-50%,-53%);border-color:#edc36e99;box-shadow:0 0 22px #3faddb25,0 15px 30px #0006}.node.selected{border-color:#ffdd97d6;box-shadow:0 0 0 1px #edc36e3d,0 0 24px #edc36e24,0 15px 30px #0006}.node-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.node-num{font:700 9px Georgia,serif;color:var(--gold)}.badge{font-size:7px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:5px}.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}.badge.running{color:#ffc86c}.badge.failed,.badge.blocked{color:var(--red)}.badge.waiting,.badge.pending,.badge.indeterminate{color:#82b5d7}.node-name{font-size:11px;font-weight:800;line-height:1.25;margin-top:10px}.node-desc{font-size:8px;color:#90a8ba;margin-top:4px;line-height:1.35;min-height:18px}.bar{height:3px;border-radius:4px;background:#ffffff14;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2bc9ff,#64e4b0);box-shadow:0 0 9px #3ad2e077}.node-bottom{display:flex;justify-content:space-between;color:#7893a8;font-size:7px;margin-top:6px}.node-bottom b{color:#d0e5f4;font-size:8px}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#7591a7;text-align:center;font-size:12px;padding:30px}.map-foot{display:flex;justify-content:space-between;gap:10px;padding:8px 15px 13px;color:#718ba0;font-size:8px}.map-foot b{color:#c3d7e5}.legend{display:flex;gap:12px;flex-wrap:wrap}.legend i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;background:var(--green)}.legend .lr{background:#ffc86c}.legend .lf{background:var(--red)}.legend .lw{background:#82b5d7}.details{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.7fr);gap:13px;margin-top:14px}.panel{border:1px solid var(--line);border-radius:14px;background:linear-gradient(140deg,#10283ad9,#0a1d2ee8);padding:16px}.panel h2{font:700 18px Georgia,serif;margin:0 0 8px}.panel p{font-size:10px;color:#91aabe;line-height:1.5;margin:0}.panel-kicker{font-size:8px;color:var(--gold);font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px}.kv{display:grid;grid-template-columns:1fr auto;gap:15px;border-top:1px solid #ffffff0d;padding:9px 0;font-size:9px;color:#88a2b6}.kv b{color:#d4e5f0;text-align:right;max-width:260px;overflow-wrap:anywhere}.checks{display:grid;gap:7px;margin-top:13px}.check{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid #ffffff0d;border-radius:9px;background:#06152255}.check-ico{width:16px;height:16px;display:grid;place-items:center;border-radius:50%;font-size:9px;font-weight:900;background:#77e4a71a;color:var(--green);flex:0 0 auto}.check-ico.failed{background:#ff99911a;color:var(--red)}.check-ico.indeterminate,.check-ico.not_verified,.check-ico.pending,.check-ico.skipped{background:#82b5d71a;color:#95c5e6}.check b{display:block;font-size:9px}.check small{display:block;color:#819aae;font-size:8px;margin-top:3px;line-height:1.4}.signal-list{display:grid;gap:8px;margin-top:11px;max-height:300px;overflow:auto}.signal{border-left:2px solid #4ec2df;padding:5px 0 6px 9px}.signal.alert{border-color:var(--red)}.signal b{display:block;font-size:9px}.signal small{display:block;color:#7f9aae;font-size:8px;margin-top:3px;line-height:1.35;overflow-wrap:anywhere}.error{max-width:650px;margin:18vh auto;padding:28px;border:1px solid #ff999155;border-radius:16px;background:#10283a}.error h1{font:700 25px Georgia,serif}.error p{color:#a6bdcc;font-size:13px;line-height:1.55}.error code{color:#ffe1a2;background:#061522;padding:3px 6px;border-radius:5px}.footer{text-align:center;color:#718ba0;font-size:8px;letter-spacing:1.2px;padding:18px}.footer b{color:var(--gold)}@keyframes flow{to{stroke-dashoffset:-110}}@media(max-width:900px){.details{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.outcome{text-align:left}.map{min-height:500px}.node{width:clamp(138px,25vw,180px);min-height:108px}.map-foot{flex-direction:column}}@media(max-width:600px){.app{padding:14px 10px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric{padding:11px;min-height:68px}.mv{font-size:15px}.map{min-height:620px;overflow:auto}.map-inner{min-width:850px}.map-foot{font-size:7px}.tools{gap:5px}.refresh{padding:7px}.top{align-items:flex-start}.connection{font-size:8px;padding:7px 9px}}
</style>
</head>
<body><div id="app" class="app"><main class="error"><h1>Opening the process river…</h1><p>UPMP is loading the current run snapshot and evidence.</p></main></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=s=>String(s||'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
let data=null,partMap=new Map(),parentPath=[],selected=null,zoom=1;
function rootParts(){return [...partMap.values()].filter(p=>!p.parent_id)}
function kids(id){return [...partMap.values()].filter(p=>p.parent_id===id)}
function descendants(id,out=[]){const p=partMap.get(id);if(!p)return out;if(p.step_id)out.push(p.step_id);for(const c of kids(id))descendants(c.part_id,out);return out}
function directChildForStep(step,id){for(const c of kids(id)){if(descendants(c.part_id).includes(step))return c.part_id}return null}
function selectedParent(){return parentPath.length?parentPath[parentPath.length-1]:null}
function currentChildren(){return selectedParent()?kids(selectedParent()):rootParts()}
function stateClass(s){s=String(s||'pending').toLowerCase();if(['succeeded','verified','passed','completed'].includes(s))return 'done';if(['running','verifying','active','waiting','scheduled'].includes(s))return 'running';if(['failed','blocked','denied'].includes(s))return 'failed';return 'waiting'}
function nodeStatus(p){return String(p.status||'pending')}
function nodeProgress(p){return p.progress_percent===null||p.progress_percent===undefined?null:Number(p.progress_percent)}
function pct(p){const v=nodeProgress(p);return v===null?'—':`${Math.round(v)}%`}
function icon(s){return s==='passed'?'✓':s==='failed'?'!':s==='skipped'?'Ⅱ':s==='pending'?'·':'?'}
function crumbs(){const trail=[...parentPath];return `<div class="crumbs"><button data-home="1">Whole process</button>${trail.map((id,i)=>`<span class="sep">›</span><button data-crumb="${esc(id)}" class="${i===trail.length-1?'here':''}">${esc(partMap.get(id)?.label||id)}</button>`).join('')}</div>`}
function visibleEdges(childrenNow){const level=selectedParent();const ids=new Set(childrenNow.map(p=>p.part_id));const candidates=[];const stepOwner=new Map();for(const p of childrenNow)for(const step of descendants(p.part_id))stepOwner.set(step,p.part_id);const allStepOwner=new Map();for(const p of partMap.values())if(p.step_id)allStepOwner.set(p.step_id,p.part_id);
 const edges=data.flow?.edges||[];for(const e of edges){let a,b;try{a=JSON.parse(e.source)[0];b=JSON.parse(e.target)[0]}catch{continue}const source=stepOwner.get(a)||allStepOwner.get(a);const target=stepOwner.get(b)||allStepOwner.get(b);if(source&&target&&source!==target&&ids.has(source)&&ids.has(target))candidates.push([source,target,e])}return candidates}
function positions(items){const n=items.length, out=new Map();items.forEach((p,i)=>{const x=n===1?50:9+i*82/(n-1);const y=n<4?50:[27,73,50,82,18,62,36,88,12][i%9];out.set(p.part_id,{x,y})});return out}
function svgFor(items){const pos=positions(items);const edges=visibleEdges(items);let paths='';for(const[a,b,e]of edges){const s=pos.get(a),t=pos.get(b);if(!s||!t)continue;const x1=s.x*10,y1=s.y*5,x2=t.x*10,y2=t.y*5,dx=(x2-x1)*.45;paths+=`<path class="stream-shadow" d="M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}"/><path class="stream-glow" d="M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}"/><path class="stream-branch" d="M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}"/>`}
 if(items.length>1&&!edges.length){const first=pos.get(items[0].part_id),last=pos.get(items.at(-1).part_id);paths+=`<path class="stream-shadow" d="M 20 250 C 180 250 260 250 380 250 L ${last.x*10-70} 250"/><path class="stream-glow" d="M 20 250 C 180 250 260 250 380 250 L ${last.x*10-70} 250"/><path class="stream-main" d="M 20 250 C 180 250 260 250 380 250 L ${last.x*10-70} 250"/><path class="stream-core" d="M 20 250 C 180 250 260 250 380 250 L ${last.x*10-70} 250"/>`;}
 return `<svg class="streams-svg" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="river"><stop stop-color="#28c8ff"/><stop offset=".35" stop-color="#4ce2c3"/><stop offset=".72" stop-color="#8d9cff"/><stop offset="1" stop-color="#ffd275"/></linearGradient><linearGradient id="tributary"><stop stop-color="#3ce5bf"/><stop offset=".55" stop-color="#3fc6ff"/><stop offset="1" stop-color="#b786ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${paths}</svg>`}
function renderMap(items){if(!items.length)return `<div class="map"><div class="empty">This declared stream has no child processes to open.</div></div>`;const pos=positions(items);return `<div class="map"><div id="map-inner" class="map-inner" style="--zoom:${zoom}">${svgFor(items)}${items.map((p,i)=>{const xy=pos.get(p.part_id),st=stateClass(p.status),pc=nodeProgress(p),isSel=selected===p.part_id;return `<button class="node ${isSel?'selected':''}" data-part="${esc(p.part_id)}" style="--x:${xy.x}%;--y:${xy.y}%" aria-label="Inspect ${esc(p.label)}"><div class="node-top"><span class="node-num">${String(i+1).padStart(2,'0')} · ${esc(p.part_id)}</span><span class="badge ${st}">${esc(nodeStatus(p))}</span></div><div class="node-name">${esc(p.label)}</div><div class="node-desc">${p.step_id?`Workflow step · ${esc(p.step_id)}`:p.required?'Required process stream':'Optional process stream'}</div><div class="bar"><i style="width:${pc===null?0:Math.max(0,Math.min(100,pc))}%"></i></div><div class="node-bottom"><span>${p.passed_checkpoints} / ${p.total_checkpoints} checks · ${p.progress_method==='declared_weights'?'weighted':'verified'}</span><b>${pct(p)}</b></div></button>`}).join('')}</div></div>`}
function selectedPart(){return selected?partMap.get(selected):null}
function findings(check){return (check.findings||[]).map(f=>`<small>${esc(f.constraint||f.name||'Finding')}: ${esc(f.message||f.status||'Evidence recorded')}</small>`).join('')}
function inspection(){const p=selectedPart();if(!p){const parent=selectedParent()?partMap.get(selectedParent()):null;const percent=parent?nodeProgress(parent):data.progress.percent;const passed=parent?`${parent.passed_checkpoints} / ${parent.total_checkpoints}`:`${data.progress.passed_checkpoints} / ${data.progress.total_checkpoints}`;return `<section class="panel"><div class="panel-kicker">${parent?'Selected process group':'Run intention'}</div><h2>${esc(parent?.label||data.run.process_id)}</h2><p>${esc(data.charter.goal||'Declared process outcome')} ${parent?'· child streams and their evidence are shown at this level.':'· run status and goal verification are distinct; process completion alone does not establish this outcome.'}</p><div class="kv"><span>Checkpoint evidence</span><b>${esc(passed)}</b></div><div class="kv"><span>Progress basis</span><b>${esc(parent?.progress_method||data.progress.method)}</b></div><div class="kv"><span>Process binding</span><b>${data.run.charter_bound?'Charter-bound · hash verified':'Not bound to this charter'}</b></div><div class="kv"><span>Acceptance policy</span><b>${esc(data.run.goal_verification?.status||'indeterminate')} · ${esc(data.run.goal_verification?.policy_id||'')}</b></div><p style="margin-top:10px">Progress is calculated from passing declared checkpoints. Missing, failed, skipped, or uncertain work does not count as success.</p></section>`}
const checks=(data.steps||[]).find(s=>s.step_id===p.step_id)?.checkpoints||[];const events=(data.events||[]).filter(e=>e.step_id===p.step_id).slice(-8).reverse();const devs=(data.deviations||[]).filter(d=>d.step_id===p.step_id);return `<section class="panel"><div class="panel-kicker">${p.step_id?'Workflow step · evidence detail':'Process stream · child detail'}</div><h2>${esc(p.label)}</h2><p>${esc(p.step_id?'A leaf step. The status below is derived from its recorded run events and verification checkpoints.':'Enter this stream to reveal its declared children. Every status remains linked to the same run and charter.')}</p><div class="kv"><span>Current execution state</span><b>${esc(p.status)}</b></div><div class="kv"><span>Verified progress</span><b>${esc(p.passed_checkpoints)} / ${esc(p.total_checkpoints)} checkpoints · ${pct(p)}</b></div><div class="kv"><span>Required in goal</span><b>${p.required?'Yes':'No'}</b></div>${checks.length?`<div class="checks">${checks.map(c=>`<div class="check"><span class="check-ico ${esc(c.status)}">${icon(c.status)}</span><div><b>${esc(title(c.phase))} · ${esc(c.status.replaceAll('_',' '))}</b><small>Policy ${esc(c.policy_id||'—')} · v${esc(c.policy_version||'—')}</small>${findings(c)}</div></div>`).join('')}</div>`:''}${devs.length?`<div class="panel-kicker" style="margin-top:16px">Mapped deviations · ${devs.length}</div><div class="signal-list">${devs.map(d=>`<div class="signal alert"><b>${esc(d.event)} · ${esc(d.status)}</b><small>${esc(JSON.stringify(d.evidence))}</small></div>`).join('')}</div>`:''}<div class="panel-kicker" style="margin-top:16px">Recent recorded events</div><div class="signal-list">${events.length?events.map(e=>`<div class="signal ${e.event.includes('failed')||e.event.includes('blocked')?'alert':''}"><b>${esc(e.event)}</b><small>${esc(e.timestamp)} · ${esc(e.branch_id||'default')}</small></div>`).join(''):'<p>No run events recorded for this step.</p>'}</div></section>`}
function signals(){const d=(data.deviations||[]).slice(-10).reverse(),m=(data.mutations||[]).slice(-10).reverse();return `<section class="panel"><div class="panel-kicker">Deviation & mutation watch</div><h2>Observed change ledger</h2><p>Deviations are derived from failed, blocked, skipped, or indeterminate records. A mutation appears only when the run explicitly records a mutation event.</p><div class="signal-list">${d.length?d.map(x=>`<div class="signal alert"><b>${esc(x.event)} · ${esc(x.step_id)} · ${esc(x.status)}</b><small>${esc(x.timestamp)} · ${esc(JSON.stringify(x.evidence))}</small></div>`).join(''):'<p>No deviation events have been recorded in this run.</p>'}${m.map(x=>`<div class="signal"><b>Mutation ${esc(x.mutation_id)} · ${esc(x.step_id)}</b><small>${esc(x.timestamp)} · ${esc(JSON.stringify(x.details))}</small></div>`).join('')||''}</div></section>`}
function render(){const kidsNow=currentChildren(),parent=selectedParent(),goalStatus=data.run.goal_outcome,pc=parent?nodeProgress(partMap.get(parent)):data.progress.percent;const pctLabel=pc===null||pc===undefined?'—':`${Math.round(pc)}%`;const deviations=data.deviations?.length||0,mutations=data.mutations?.length||0;const status=data.run.run_status;const rootName=parent?partMap.get(parent).label:'Process river';$('#app').innerHTML=`<header class="top"><div class="brand"><div class="emblem"><img src="assets/brand-emblem.jpg" alt="UPMP sapphire and gold emblem"></div><div><img class="wordmark" src="assets/brand-wordmark.png" alt="UPMP"><small>PROCESS OBSERVATORY</small></div></div><div class="connection"><i class="dot"></i> LIVE RUN SNAPSHOT</div></header>${crumbs()}<section class="hero"><div><div class="eyebrow">UPMP · Monitor · Verify · Ensure</div><h1>${esc(rootName)}</h1><p class="goal">${esc(data.charter.goal||'Declared process goal')} · ${esc(data.run.process_id)} · ${esc(data.run.charter_version)} · run ${esc(data.run.run_id||'unbound')}</p></div><div class="outcome"><span>Goal outcome</span><b class="${goalStatus==='verified'?'verified':goalStatus==='failed'?'failed':''}">${esc(goalStatus)}</b><span style="margin-top:6px">Run ${esc(status)} · ${data.run.charter_bound?'bound':'unbound'}</span></div></section><section class="metrics"><div class="metric"><div class="ml">Desired outcome</div><div class="mv">${goalStatus==='verified'?'Policy verified':goalStatus==='failed'?'Goal failed':'Evidence pending'} <small>· ${esc(data.run.goal_verification?.policy_id||'acceptance rule')}</small></div></div><div class="metric"><div class="ml">Actual verified progress</div><div class="mv">${pctLabel} <small>· ${esc(parent?`${partMap.get(parent).passed_checkpoints}/${partMap.get(parent).total_checkpoints}`:`${data.progress.passed_checkpoints}/${data.progress.total_checkpoints}`)} checkpoints</small></div></div><div class="metric"><div class="ml">Deviation watch</div><div class="mv" style="color:${deviations?'var(--red)':'var(--green)'}">${deviations} mapped <small>· evidence-led</small></div></div><div class="metric"><div class="ml">Mutation ledger</div><div class="mv">${mutations} recorded <small>· explicit events only</small></div></div></section><section class="river"><header class="river-head"><div><div class="river-title">${esc(rootName)} · process tributaries</div><div class="river-sub">${kidsNow.length} declared child stream${kidsNow.length===1?'':'s'} · select to inspect · open a group to focus its sub-processes</div></div><div class="tools"><button id="refresh" class="refresh">↻ Refresh</button><div class="zoom"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">${Math.round(zoom*100)}%</span><button id="zoom-in" aria-label="Zoom in">+</button></div></div></header>${renderMap(kidsNow)}<div class="map-foot"><div class="legend"><span><i></i>Succeeded / verified</span><span><i class="lr"></i>Running / in progress</span><span><i class="lf"></i>Failed / blocked</span><span><i class="lw"></i>Waiting / indeterminate</span></div><div><b>Connections:</b> only declared workflow dependencies and transitions are drawn.</div></div></section><section class="details">${inspection()}${signals()}</section><footer class="footer">UPMP <b>◆</b> VERIFIED EVENTS · DECLARED GOALS · TRACEABLE PROCESS CHANGE</footer>`;
 document.querySelectorAll('[data-part]').forEach(b=>{b.onclick=()=>{selected=b.dataset.part;render()};b.ondblclick=()=>{if(kids(selected).length){parentPath.push(selected);selected=null;zoom=1;render()}}});document.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{const ix=parentPath.indexOf(b.dataset.crumb);parentPath=parentPath.slice(0,ix+1);selected=null;zoom=1;render()});$('[data-home]').onclick=()=>{parentPath=[];selected=null;zoom=1;render()};$('#zoom-in').onclick=()=>{zoom=Math.min(1.5,zoom+.1);render()};$('#zoom-out').onclick=()=>{if(zoom>1)zoom=Math.max(1,zoom-.1);else if(parentPath.length){parentPath.pop();selected=null;render()}};$('#refresh').onclick=load}
async function load(){try{const r=await fetch('/api/process-run',{cache:'no-store'});if(!r.ok)throw Error(`Snapshot request returned ${r.status}`);data=await r.json();if(!data.run||!data.parts||!data.progress)throw Error('Snapshot is missing UPMP process-run fields.');partMap=new Map(data.parts.map(p=>[p.part_id,p]));if(selected&&!partMap.has(selected))selected=null;render()}catch(e){$('#app').innerHTML=`<main class="error"><div class="eyebrow">UPMP · LIVE PROCESS OBSERVATORY</div><h1>The run snapshot is not available</h1><p>${esc(e.message)}</p><p>Start the UPMP observatory bridge and open the address it prints. The bridge reads the latest run snapshot from its configured file.</p><p><code>GET /api/process-run</code></p><button class="refresh" onclick="location.reload()">Try again</button></main>`}}
load();setInterval(()=>{if(document.visibilityState==='visible')load()},2500);
</script></body></html>
